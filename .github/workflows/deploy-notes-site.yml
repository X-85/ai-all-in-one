name: Deploy lang-evolution-notes to Pages

on:
  push:
    branches: [main]
    paths:
      - 'lang-evolution-notes/**'
      - 'knowledge/doc/lang-evolution-notes/**'
      - '.github/workflows/deploy-notes-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-notes-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          path: lang-evolution-notes
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: lang-evolution-notes/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
