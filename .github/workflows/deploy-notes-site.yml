name: Deploy lang-evolution-notes to Pages

on:
  push:
    branches: [main]
    paths:
      - 'lang-evolution-notes/**'
      - 'knowledge/doc/lang-evolution-notes/**'
      - '.github/workflows/deploy-notes-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-notes-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # withastro/action 内置 Upload Pages Artifact 步骤(产物名 github-pages),
        # 不要再显式调 actions/upload-pages-artifact,否则同名产物 409 冲突
      - uses: withastro/action@v3
        with:
          path: lang-evolution-notes

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
